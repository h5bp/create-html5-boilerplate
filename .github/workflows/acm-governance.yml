name: "ACM Governance Gate"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-acm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate ACM Manifest in PR Body
        run: |
          npx @roblarsen/acm-cli validate --pr-body "${{ github.event.pull_request.body }}" || {
            echo "❌ ACM v1.1 validation failed."
            echo ""
            echo "Please ensure your PR description contains a valid ACM v1.1 manifest block:"
            echo "  - Frontmatter YAML with acm_version, change_type, risk_level, contracts, etc."
            echo "  - Four narrative sections (Invariants, State Topology, Network Assumptions, Non-Goals)"
            echo ""
            echo "For details, see .github/copilot-instructions.md"
            exit 1
          }

      - name: Verify Risk Floor Compliance
        run: |
          npx @roblarsen/acm-cli validate --pr-body "${{ github.event.pull_request.body }}" --strict || {
            echo "❌ Risk floor rules violated."
            echo ""
            echo "ACM v1.1 risk-floor rules:"
            echo "  - data_loss_safety: unsupported  →  risk_level ≥ critical"
            echo "  - data_loss_safety: unknown      →  risk_level ≥ high"
            echo "  - concurrency_safety: unknown    →  risk_level ≥ medium"
            echo ""
            echo "Update your ACM manifest to comply."
            exit 1
          }

      - name: Comment on PR (Success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ ACM v1.1 governance gate passed. Manifest is valid and risk floor rules are satisfied.'
            })

      - name: Comment on PR (Failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ ACM v1.1 validation failed. See workflow logs and .github/copilot-instructions.md for guidance.'
            })
